services:
  postgres:
    image: postgres:16-alpine
    container_name: crossvpn-postgres
    environment:
      POSTGRES_DB: crossvpn
      POSTGRES_USER: crossvpn
      POSTGRES_PASSWORD: crossvpn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crossvpn -d crossvpn"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crossvpn-app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000:3000"
    command: sh -c "npx prisma migrate deploy && node dist/main.js"

volumes:
  postgres_data:
